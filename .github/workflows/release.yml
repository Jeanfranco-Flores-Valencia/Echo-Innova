name: Publicar versión

# Se ejecuta al crear un tag de versión (v1.1, v1.2...). Compila, corre las pruebas
# y publica el APK en GitHub Releases para que cualquiera lo descargue.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Preparar archivos
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk echo-guard.apk
          cp app/build/outputs/apk/debug/app-debug.apk "echo-guard-${GITHUB_REF_NAME}.apk"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Echo Guard ${{ github.ref_name }} · versión de prueba
          body_path: .github/release-notes.md
          files: |
            echo-guard.apk
            echo-guard-${{ github.ref_name }}.apk
